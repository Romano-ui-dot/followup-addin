<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-up de Pedidos</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --ink:#12161c; --ink-2:#3d4652; --ink-3:#707c8c;
  --paper:#f7f6f3; --card:#ffffff; --line:#e2e0da;
  --late:#b3352c; --late-bg:#fbeceb;
  --week:#c8781a; --week-bg:#fdf3e6;
  --ok:#2c7a5a; --ok-bg:#eaf5f0;
  --none:#5b5f8a; --none-bg:#eeeef7;
  --accent:#1f3a5f;
}
[data-theme="dark"]{
  --ink:#e8eaed; --ink-2:#b4bcc7; --ink-3:#8a94a3;
  --paper:#12151a; --card:#1b1f27; --line:#2c323c;
  --late:#f0857c; --late-bg:#3a2320;
  --week:#e8a54d; --week-bg:#3a2f1c;
  --ok:#5fc397; --ok-bg:#1c3229;
  --none:#9ba0d4; --none-bg:#232538;
  --accent:#6ea8e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 60px}

header{display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
h1{font-size:20px;font-weight:680;letter-spacing:-.02em}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:7px 13px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:560;
  font-family:inherit}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.led{font-size:11px;margin-right:2px}

/* base tabs */
.bases{display:flex;gap:6px;margin:18px 0 16px;flex-wrap:wrap}
.basetab{padding:9px 18px;border:1px solid var(--line);background:var(--card);
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);
  font-family:inherit;display:flex;align-items:center;gap:8px}
.basetab .n{font-size:11.5px;color:var(--ink-3);font-weight:500}
.basetab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.basetab.on .n{color:#c5d3e4}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 15px;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--ink-3)}
.kpi.on{border-color:var(--ink);border-width:1.5px;box-shadow:0 1px 0 var(--ink)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3.5px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.055em;
  color:var(--ink-3);font-weight:640;margin-bottom:7px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.kpi .fo{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.k-late .bar{background:var(--late)} .k-late .val{color:var(--late)}
.k-week .bar{background:var(--week)} .k-week .val{color:var(--week)}
.k-ok .bar{background:var(--ok)}     .k-ok .val{color:var(--ok)}
.k-none .bar{background:var(--none)} .k-none .val{color:var(--none)}
.k-all .bar{background:var(--ink-3)}

.hint{font-size:11.5px;color:var(--ink-3);margin:9px 2px 20px}

/* responsavel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:15px 17px;margin-bottom:18px}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:.055em;
  color:var(--ink-3);font-weight:640;margin-bottom:12px}
.rrow{display:grid;grid-template-columns:118px 1fr 128px;gap:12px;
  align-items:center;padding:5px 0;cursor:pointer;border-radius:5px}
.rrow:hover{background:var(--paper)}
.rrow.on{background:var(--line)}
.rname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname .sm{color:var(--ink-3);font-weight:400}
.rbar{display:flex;height:15px;border-radius:3px;overflow:hidden;background:#f0efec}
.rbar i{display:block}
.rnum{font-size:11.5px;color:var(--ink-3);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rnum b{color:var(--late);font-weight:650}

/* filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
  gap:9px;margin-bottom:14px}
select,input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);font-size:12.5px;color:var(--ink);font-family:inherit}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}

.bar-info{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:9px;flex-wrap:wrap;gap:9px}
.count{font-size:12.5px;color:var(--ink-3)}
.count b{color:var(--ink);font-weight:650}

/* tabela */
.tbox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto;max-height:66vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--paper);text-align:left;
  padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-2);font-weight:680;border-bottom:1px solid var(--line);
  cursor:pointer;white-space:nowrap;z-index:2}
thead th:hover{background:var(--line)}
tbody td{padding:9px 11px;border-bottom:1px solid #f0efec;vertical-align:top}
tbody tr:hover{background:var(--paper)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.it{max-width:270px}
.it .cd{color:var(--ink-3);font-size:11px;margin-top:2px}
.fn{max-width:190px;font-size:12px}

.tag{display:inline-block;padding:2.5px 8px;border-radius:20px;
  font-size:10.5px;font-weight:670;white-space:nowrap}
.t-late{background:var(--late-bg);color:var(--late)}
.t-week{background:var(--week-bg);color:var(--week)}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-none{background:var(--none-bg);color:var(--none)}
.dlate{color:var(--late);font-weight:670}

.obs{max-width:290px;font-size:12px;color:var(--ink-2)}
.obs.empty{color:#b8b4ac;font-style:italic}
.flag{display:inline-block;margin-top:4px;font-size:10px;font-weight:670;
  color:var(--week);background:var(--week-bg);padding:1.5px 6px;border-radius:4px;
  letter-spacing:.02em}

.empty-state{padding:50px 20px;text-align:center;color:var(--ink-3)}
.foot{margin-top:16px;font-size:11.5px;color:var(--ink-3);line-height:1.6}

.obs-cell{cursor:text;min-height:20px;border-radius:5px;padding:3px 5px;margin:-3px -5px;
  border:1px solid transparent}
.obs-cell:hover{border-color:var(--line);background:#fcfbf9}
.obs-cell:focus{outline:none;border-color:var(--accent);background:#fff;
  box-shadow:0 0 0 2px rgba(31,58,95,.12)}
.obs-cell.saving{opacity:.55}
.obs-cell.saved{background:#eaf5f0;border-color:var(--ok)}
.obs-cell.failed{background:#fbeceb;border-color:var(--late)}

.modal{position:fixed;inset:0;background:rgba(18,22,28,.6);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.mbox{background:var(--card);border-radius:13px;max-width:520px;width:100%;
  max-height:86vh;overflow:auto;padding:22px 24px}
.mbox h2{font-size:16px;margin-bottom:5px;font-weight:680}
.mbox p{font-size:12.5px;color:var(--ink-2);margin-bottom:14px;line-height:1.55}
.mact{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
@media(max-width:760px){
  .rrow{grid-template-columns:96px 1fr;gap:8px}
  .rnum{grid-column:2;text-align:left}
  .kpi .val{font-size:24px}
}
.filters2{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px;
  justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 12px;border:1px solid var(--line);background:var(--card);
  border-radius:20px;cursor:pointer;font-size:12px;font-weight:560;color:var(--ink-3);
  font-family:inherit;user-select:none}
.pill:hover{border-color:var(--ink-3);color:var(--ink)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="dark"] .pill.on{color:var(--paper)}
.ranges{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rlbl{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;
  letter-spacing:.04em}
.rsep{font-size:11.5px;color:var(--ink-3)}
.rin{width:66px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);font-size:12px;color:var(--ink);font-family:inherit}
.rdate{width:140px}

/* logo canto inferior direito */
.brand{position:fixed;bottom:16px;right:18px;z-index:40;height:24px;opacity:.55;
  pointer-events:none}
.brand img{height:100%;width:auto;display:block}
.brand .logo-dark{display:none}
[data-theme="dark"] .brand .logo-light{display:none}
[data-theme="dark"] .brand .logo-dark{display:block}
.themebtn{position:fixed;left:18px;bottom:18px;z-index:50;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.18);font-size:17px;transition:transform .15s}
.themebtn:hover{transform:scale(1.08);color:var(--ink)}
@media(max-width:760px){ .brand{height:18px;bottom:12px;right:12px;opacity:.4} }
</style>
</head>

<script>
/* =========================================================================
   Follow-up de Pedidos — versão add-in (lê e grava direto na planilha viva
   via Office.js, sem copia-e-cola de Office Script, sem arquivo local).
   ========================================================================= */

const CFG = {
  BR:  { sheet:"Observação BR",  keyCol:9,  obsCol:10, isSC:false },
  EUA: { sheet:"Observação EUA", keyCol:9,  obsCol:10, isSC:false },
  SC:  { sheet:"Observação SC",  keyCol:11, obsCol:13, isSC:true  }
};

function chaveDe(row){
  return CFG[row.base].isSC
    ? `${row.fornecedor}${row.pedido}${row.codigo}${row.linha}`
    : `${row.base}${row.pedido}${row.fornecedor}${row.codigo}${row.qtd}${row.tipo}${row.linha}`;
}

function serial2iso(n){
  const ms = Date.UTC(1899,11,30) + n*86400000;
  const d = new Date(ms);
  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10);
}
function toISO(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number' && v>0) return serial2iso(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : '';
}

/* ---------- leitura: substitui o Office Script "ExportarDados" ---------- */
async function lerTudo(){
  return await Excel.run(async (ctx)=>{
    const wb = ctx.workbook;

    const getVals = async (nome, cols) => {
      const ws = wb.worksheets.getItemOrNullObject(nome);
      await ctx.sync();
      if(ws.isNullObject) return null;
      const ur = ws.getUsedRangeOrNullObject();
      ur.load('rowCount');
      await ctx.sync();
      const rc = ur.isNullObject ? 0 : ur.rowCount;
      if(rc < 1) return [];
      const rg = ws.getRangeByIndexes(0,0,rc,cols);
      rg.load('values');
      await ctx.sync();
      return rg.values;
    };

    // ---- Base: fornecedor -> responsável padrão
    const resp = {};
    const vBase = await getVals('Base', 4);
    if(vBase) for(let i=1;i<vBase.length;i++){
      const f = String(vBase[i][1]??'').trim(), d = String(vBase[i][3]??'').trim();
      if(f && d) resp[f.toLowerCase()] = d;
    }

    // ---- Resp_Manual: exceção de responsável por pedido (BR/EUA)
    // Fecha uma divergência conhecida: o script antigo não lia isso e o dash
    // mostrava o responsável do fornecedor mesmo em pedidos com exceção.
    const respManual = {};
    const vRM = await getVals('Resp_Manual', 4);
    if(vRM) for(let i=1;i<vRM.length;i++){
      const chave = String(vRM[i][0]??'').trim();
      const d = String(vRM[i][3]??'').trim();
      if(chave && d) respManual[chave] = d;
    }

    // ---- Observações BR/EUA (chave em J, obs em K)
    const obsExata = {}, obsFall = {};
    const lerObs = (v) => {
      if(!v) return;
      for(let i=1;i<v.length;i++){
        const chave = String(v[i][9]??'').trim();
        const o = String(v[i][10]??'').trim();
        if(!o) continue;
        if(chave) obsExata[chave] = o;
        const fk = `${v[i][1]}|${String(v[i][3]??'').trim()}|${v[i][8]}`;
        if(!obsFall[fk]) obsFall[fk] = o;
      }
    };
    lerObs(await getVals('Observação BR', 11));
    lerObs(await getVals('Observação EUA', 11));

    // ---- Observação SC (chave em L, obs em N, responsável em M)
    // Fecha a segunda divergência conhecida: o responsável de SC nunca
    // era lido pelo script antigo (saía sempre em branco no dash).
    const respExataSC = {}, respFallSC = {};
    const lerObsSC = (v) => {
      if(!v) return;
      for(let i=1;i<v.length;i++){
        const chave = String(v[i][11]??'').trim();
        const o = String(v[i][13]??'').trim();
        const r = String(v[i][12]??'').trim();
        const fk = `${v[i][1]}|${String(v[i][2]??'').trim()}|${v[i][10]}`;
        if(o){ if(chave) obsExata[chave]=o; if(!obsFall[fk]) obsFall[fk]=o; }
        if(r){ if(chave) respExataSC[chave]=r; if(!respFallSC[fk]) respFallSC[fk]=r; }
      }
    };
    lerObsSC(await getVals('Observação SC', 14));

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const out = [];

    const lerPC = (v, baseK) => {
      if(!v) return;
      for(let i=1;i<v.length;i++){
        const ped = v[i][1];
        if(ped==='' || ped===null || ped===undefined) continue;
        const ln = v[i][2], forn = String(v[i][4]??'').trim(), comp = String(v[i][7]??'').trim();
        const dAlm = v[i][9], cod = String(v[i][11]??'').trim(), item = String(v[i][12]??'').trim();
        const qtd = v[i][13], proj = String(v[i][19]??'').trim(), tipo = String(v[i][27]??'').trim();
        const iso = toISO(dAlm);
        let dias = null;
        if(iso){ const d = new Date(iso+'T00:00:00'); dias = Math.round((d-hoje)/86400000); }
        const chave = `${baseK}${ped}${forn}${cod}${qtd}${tipo}${ln}`;
        let o = obsExata[chave] ?? '', org = o ? 'exata' : '';
        if(!o){ const f = obsFall[`${ped}|${cod}|${ln}`]; if(f){ o=f; org='resgate'; } }
        const respFinal = respManual[`${baseK}${ped}`] || resp[forn.toLowerCase()] || '';
        out.push({ base:baseK, pedido:ped, linha:ln, fornecedor:forn, comprador:comp,
          responsavel:respFinal, codigo:cod, item, qtd,
          data:iso, dias, tipo, projeto:proj, obs:o, obsOrigem:org });
      }
    };

    const lerSC = (v) => {
      if(!v) return;
      for(let i=1;i<v.length;i++){
        const sc = v[i][1];
        if(sc==='' || sc===null || sc===undefined) continue;
        const origem = String(v[i][0]??'').trim(), solic = String(v[i][3]??'').trim();
        const dNec = v[i][8], ln = v[i][11], cod = String(v[i][14]??'').trim();
        const item = String(v[i][15]??'').trim(), qtd = v[i][18];
        const status = String(v[i][24]??'').trim(), proj = String(v[i][28]??'').trim();
        const iso = toISO(dNec);
        let dias = null;
        if(iso){ const d = new Date(iso+'T00:00:00'); dias = Math.round((d-hoje)/86400000); }
        const chave = `${origem}${sc}${cod}${ln}`;
        let o = obsExata[chave] ?? '', org = o ? 'exata' : '';
        if(!o){ const f = obsFall[`${sc}|${cod}|${ln}`]; if(f){ o=f; org='resgate'; } }
        let r_ = respExataSC[chave] ?? '';
        if(!r_){ r_ = respFallSC[`${sc}|${cod}|${ln}`] ?? ''; }
        out.push({ base:'SC', pedido:sc, linha:ln, fornecedor:origem||'SC', comprador:solic,
          responsavel:r_, codigo:cod, item, qtd, data:iso, dias, tipo:status, projeto:proj,
          obs:o, obsOrigem:org });
      }
    };

    lerPC(await getVals('PC Geral BR', 28), 'BR');
    lerPC(await getVals('PC Geral EUA', 28), 'EUA');
    lerSC(await getVals('SC Robô', 29));

    return out;
  });
}

/* ---------- gravação: substitui o Office Script "AplicarObservacoes" ---------- */
async function salvarObservacao(row, novoTexto){
  const cfg = CFG[row.base];
  if(!cfg) throw new Error('Base desconhecida: '+row.base);
  const chave = chaveDe(row);

  return await Excel.run(async (ctx)=>{
    const ws = ctx.workbook.worksheets.getItemOrNullObject(cfg.sheet);
    await ctx.sync();
    if(ws.isNullObject) throw new Error('Aba "'+cfg.sheet+'" não encontrada.');

    const ur = ws.getUsedRangeOrNullObject();
    ur.load('rowCount');
    await ctx.sync();
    const rc = ur.isNullObject ? 1 : ur.rowCount;

    let keys = [], obsVals = [];
    if(rc > 1){
      const kR = ws.getRangeByIndexes(1, cfg.keyCol, rc-1, 1);
      const oR = ws.getRangeByIndexes(1, cfg.obsCol, rc-1, 1);
      kR.load('values'); oR.load('values');
      await ctx.sync();
      keys = kR.values.map(r=>String(r[0]??'').trim());
      obsVals = oR.values.map(r=>String(r[0]??'').trim());
    }

    const idx = keys.indexOf(chave);

    if(idx >= 0){
      const atual = obsVals[idx];
      if(atual && atual !== row.obs && atual !== novoTexto){
        const e = new Error('conflito');
        e.conflito = true; e.atual = atual;
        throw e;
      }
      ws.getCell(idx+1, cfg.obsCol).values = [[novoTexto]];
    } else {
      const r = rc + 1, rz = r - 1;
      if(cfg.isSC){
        ws.getRangeByIndexes(rz,0,1,5).values = [[row.fornecedor, row.pedido, row.codigo, row.item, row.qtd ?? '']];
        ws.getCell(rz,7).values  = [[row.projeto || '']];
        ws.getCell(rz,9).values  = [[row.comprador || '']];
        ws.getCell(rz,10).values = [[row.linha ?? '']];
        ws.getCell(rz,11).formulas = [[`=A${r}&B${r}&C${r}&K${r}`]];
        ws.getCell(rz,13).values = [[novoTexto]];
        ws.getCell(rz,14).formulas = [[`=IF(COUNTIF('Análise SC'!L:L,L${r})>0,"Ok","Não encontrado")`]];
      } else {
        const dataTxt = row.data ? row.data.split('-').reverse().join('/') : '';
        ws.getRangeByIndexes(rz,0,1,9).values = [[
          row.base, row.pedido, row.fornecedor, row.codigo, row.item,
          dataTxt, row.qtd ?? '', row.tipo, row.linha ?? ''
        ]];
        ws.getCell(rz,9).formulas = [[`=A${r}&B${r}&C${r}&D${r}&G${r}&H${r}&I${r}`]];
        ws.getCell(rz,10).values = [[novoTexto]];
        const ana = row.base==='EUA' ? 'Análise EUA' : 'Análise BR';
        ws.getCell(rz,11).formulas = [[`=IF(COUNTIF('${ana}'!K:K,J${r})>0,"Ok","Não encontrado")`]];
      }
    }
    await ctx.sync();
  });
}

let ROWS = [];
let ultimaAtualizacao = null;
const BASES = [{k:'BR',n:'Brasil'},{k:'EUA',n:'Estados Unidos'},{k:'SC',n:'Solicitações'}];
let base='BR', kpi=null, sortK='dias', sortA=true;
const RESP_SEL = new Set();

function drawRespPills(){
  const d = ofBase();
  const nomes = [...new Set(d.map(r=>r.responsavel||'(não atribuído)'))]
    .sort((a,b)=>a.localeCompare(b,'pt'));
  const el = document.getElementById('respPills');
  el.innerHTML = nomes.map(n=>{
    const cnt = d.filter(r=>(r.responsavel||'(não atribuído)')===n).length;
    const lbl = n==='(não atribuído)' ? 'sem resp.' : n;
    return `<span class="pill ${RESP_SEL.has(n)?'on':''}" data-r="${esc(n)}">${esc(lbl)} <span style="opacity:.6">${cnt}</span></span>`;
  }).join('');
  el.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
    const n = p.dataset.r;
    if(RESP_SEL.has(n)) RESP_SEL.delete(n); else RESP_SEL.add(n);
    drawRespPills(); drawTable();
  });
}

const rowKey = r => `${r.base}|${r.pedido}|${r.codigo}|${r.linha}|${r.qtd}|${r.tipo}`;
const st = r => r.dias===null ? 'none' : r.dias<0 ? 'late' : r.dias<=7 ? 'week' : 'ok';
const LB = {late:'Atrasado',week:'Vence em 7 dias',ok:'No prazo',none:'Sem data'};
const fmtD = d => d ? d.split('-').reverse().join('/') : '—';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ofBase(){ return ROWS.filter(r=>r.base===base); }

function drawBases(){
  document.getElementById('bases').innerHTML = BASES.map(b=>{
    const rs = ROWS.filter(r=>r.base===b.k);
    const np = new Set(rs.map(r=>r.pedido)).size;
    return `<button class="basetab ${b.k===base?'on':''}" data-b="${b.k}">
      ${b.n}<span class="n">${np} ped · ${rs.length}L</span></button>`;
  }).join('');
  document.querySelectorAll('.basetab').forEach(el=>el.onclick=()=>{
    base=el.dataset.b; kpi=null; resetFilters(); drawAll();
  });
}

const RANK = {late:0,week:1,none:2,ok:3};
function pedStatus(rows){
  let best='ok';
  rows.forEach(r=>{ if(RANK[st(r)]<RANK[best]) best=st(r); });
  return best;
}
function byPedido(d){
  const m = new Map();
  d.forEach(r=>{ const k=r.pedido; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); });
  return m;
}
function drawKpis(){
  const d = ofBase();
  const lc = {late:0,week:0,ok:0,none:0};
  d.forEach(r=>lc[st(r)]++);
  const pc_ = {late:0,week:0,ok:0,none:0};
  const mp = byPedido(d);
  mp.forEach(rows=>pc_[pedStatus(rows)]++);
  const totP = mp.size;
  const pct = n => totP? Math.round(n/totP*100):0;
  const cards = [
    ['week','k-week','Vence esta semana',pc_.week,`${lc.week} linhas · próximos 7 dias`],
    ['late','k-late','Atrasados',pc_.late,`${lc.late} linhas · ${pct(pc_.late)}% dos pedidos`],
    ['ok','k-ok','No prazo',pc_.ok,`${lc.ok} linhas · acima de 7 dias`],
    ['none','k-none','Sem data',pc_.none,`${lc.none} linhas · sem previsão`],
    [null,'k-all','Total em aberto',totP,`${d.length} linhas de pedido`]
  ];
  document.getElementById('kpis').innerHTML = cards.map(([k,cl,l,v,f])=>
    `<div class="kpi ${cl} ${kpi===k&&k?'on':''}" data-k="${k||''}">
      <div class="bar"></div><div class="lbl">${l}</div>
      <div class="val">${v}</div><div class="fo">${f}</div></div>`).join('');
  document.querySelectorAll('.kpi').forEach(el=>el.onclick=()=>{
    const k = el.dataset.k;
    kpi = (!k || kpi===k) ? null : k;
    drawKpis(); drawTable();
  });
}

function drawResp(){
  const d = ofBase(), m = {};
  const grp = new Map();
  d.forEach(r=>{
    const rk = r.responsavel || '(não atribuído)';
    const key = rk+'␀'+r.pedido;
    if(!grp.has(key)) grp.set(key,{r:rk,rows:[]});
    grp.get(key).rows.push(r);
  });
  grp.forEach(v=>{
    m[v.r] = m[v.r] || {late:0,week:0,ok:0,none:0,t:0,L:0};
    m[v.r][pedStatus(v.rows)]++; m[v.r].t++; m[v.r].L += v.rows.length;
  });
  const arr = Object.entries(m).sort((a,b)=>b[1].late-a[1].late || b[1].t-a[1].t);
  const mx = Math.max(1,...arr.map(x=>x[1].t));
  const cur = document.getElementById('fResp').value;
  document.getElementById('resp').innerHTML = arr.map(([n,v])=>{
    const w = p => (v[p]/mx*100).toFixed(1)+'%';
    return `<div class="rrow ${cur===n?'on':''}" data-r="${esc(n)}">
      <div class="rname">${n==='(não atribuído)'?'<span class="sm">não atribuído</span>':esc(n)}</div>
      <div class="rbar">
        <i style="width:${w('late')};background:var(--late)"></i>
        <i style="width:${w('week')};background:var(--week)"></i>
        <i style="width:${w('ok')};background:var(--ok)"></i>
        <i style="width:${w('none')};background:var(--none)"></i>
      </div>
      <div class="rnum"><b>${v.late}</b> atras. · ${v.t} ped · ${v.L}L</div>
    </div>`;
  }).join('') || '<div style="color:var(--ink-3);font-size:12.5px">Sem dados.</div>';
  document.querySelectorAll('.rrow').forEach(el=>el.onclick=()=>{
    const s = document.getElementById('fResp');
    s.value = s.value===el.dataset.r ? '' : el.dataset.r;
    drawResp(); drawTable();
  });
}

function fillSel(id,key,label){
  const d = ofBase();
  const vals = [...new Set(d.map(r=>r[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt'));
  const s = document.getElementById(id), cur = s.value;
  s.innerHTML = `<option value="">${label} (todos)</option>` +
    vals.map(v=>`<option value="${esc(v)}">${esc(String(v).slice(0,52))}</option>`).join('');
  if(vals.includes(cur)) s.value = cur;
}

function filtered(){
  let d = ofBase();
  if(kpi){
    const keep = new Set();
    byPedido(d).forEach((rows,k)=>{ if(pedStatus(rows)===kpi) keep.add(k); });
    d = d.filter(r=>keep.has(r.pedido));
  }
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(q){
    const termos = q.split(/[\s,;]+/).filter(Boolean);
    d = d.filter(r=>{
      const campos = [r.pedido,r.item,r.codigo,r.fornecedor,r.obs]
        .map(v=>String(v??'').toLowerCase());
      return termos.some(t=>campos.some(c=>c.includes(t)));
    });
  }
  const gv = id => document.getElementById(id).value;
  const cp = gv('fComp'), fr = gv('fForn'), pj = gv('fProj'), ob = gv('fObs');
  const rp = gv('fResp');
  if(rp) d = d.filter(r=>(r.responsavel||'(não atribuído)')===rp);
  if(RESP_SEL.size) d = d.filter(r=>RESP_SEL.has(r.responsavel||'(não atribuído)'));
  if(cp) d = d.filter(r=>r.comprador===cp);
  if(fr) d = d.filter(r=>r.fornecedor===fr);
  if(pj) d = d.filter(r=>r.projeto===pj);
  if(ob==='sem') d = d.filter(r=>!r.obs);
  if(ob==='com') d = d.filter(r=>r.obs);
  if(ob==='resgate') d = d.filter(r=>r.obsOrigem==='resgate');
  const dMin = gv('dMin'), dMax = gv('dMax');
  if(dMin!=='') d = d.filter(r=>r.dias!==null && r.dias>=Number(dMin));
  if(dMax!=='') d = d.filter(r=>r.dias!==null && r.dias<=Number(dMax));
  const dtF = gv('dtFrom'), dtT = gv('dtTo');
  if(dtF) d = d.filter(r=>r.data && r.data>=dtF);
  if(dtT) d = d.filter(r=>r.data && r.data<=dtT);
  return d;
}

let conflitoResolver = null;
function pedirConfirmacaoConflito(atual, novo){
  return new Promise(res=>{
    document.getElementById('conflitoTxt').textContent =
      `Alguém já escreveu "${atual}" nessa linha depois que você abriu o painel. Substituir por "${novo}"?`;
    document.getElementById('conflitoModal').classList.add('show');
    conflitoResolver = res;
  });
}
document.getElementById('conflitoSobrescrever').onclick=()=>{
  document.getElementById('conflitoModal').classList.remove('show');
  if(conflitoResolver) conflitoResolver(true);
};
document.getElementById('conflitoCancelar').onclick=()=>{
  document.getElementById('conflitoModal').classList.remove('show');
  if(conflitoResolver) conflitoResolver(false);
};

async function tentarSalvar(el, row, txt){
  el.classList.remove('saved','failed');
  el.classList.add('saving');
  el.setAttribute('contenteditable','false');
  try{
    await salvarObservacao(row, txt);
    row.obs = txt; row.obsOrigem = 'exata';
    el.classList.remove('saving'); el.classList.add('saved');
    setTimeout(()=>el.classList.remove('saved'),1200);
  }catch(err){
    el.classList.remove('saving');
    if(err && err.conflito){
      const manter = await pedirConfirmacaoConflito(err.atual, txt);
      if(manter){
        const rowFingido = Object.assign({}, row, {obs: err.atual});
        try{
          await salvarObservacao(rowFingido, txt);
          row.obs = txt; row.obsOrigem = 'exata';
          el.classList.add('saved'); setTimeout(()=>el.classList.remove('saved'),1200);
        }catch(e2){
          el.classList.add('failed');
          alert('Não consegui gravar: '+e2.message);
        }
      } else {
        el.classList.add('failed');
        setTimeout(()=>el.classList.remove('failed'),1500);
      }
    } else {
      el.classList.add('failed');
      alert('Não consegui gravar a observação: '+(err&&err.message||err));
    }
  }
  el.setAttribute('contenteditable','true');
  drawTable();
}

function drawTable(){
  const COLS = cols();
  document.getElementById('head').innerHTML = COLS.map(([k,l])=>
    `<th data-s="${k}">${l}${sortK===k?(sortA?' ↑':' ↓'):''}</th>`).join('');
  document.querySelectorAll('th').forEach(el=>el.onclick=()=>{
    const k = el.dataset.s;
    if(sortK===k) sortA=!sortA; else {sortK=k;sortA=true;}
    drawTable();
  });

  let d = filtered().slice();
  d.sort((a,b)=>{
    let x,y;
    if(sortK==='_st'){ const o={late:0,week:1,none:2,ok:3}; x=o[st(a)];y=o[st(b)]; }
    else { x=a[sortK]; y=b[sortK]; }
    if(x===null||x===undefined) x = sortA? 1e12 : -1e12;
    if(y===null||y===undefined) y = sortA? 1e12 : -1e12;
    if(typeof x==='string') return sortA? x.localeCompare(y,'pt') : y.localeCompare(x,'pt');
    return sortA? x-y : y-x;
  });

  const totL = ofBase().length, totP = byPedido(ofBase()).size;
  const shownP = byPedido(d).size;
  document.getElementById('cnt').innerHTML =
    `<b>${shownP}</b> de ${totP} pedidos · <b>${d.length}</b> de ${totL} linhas`
    + (kpi?` · ${LB[kpi]}`:'');

  const show = d.slice(0,600);
  document.getElementById('body').innerHTML = show.length ? show.map(r=>{
    const s = st(r);
    const rk = rowKey(r);
    const dias = r.dias===null ? '—'
      : r.dias<0 ? `<span class="dlate">${Math.abs(r.dias)}d atraso</span>`
      : r.dias===0 ? 'hoje' : `${r.dias}d`;
    return `<tr>
      <td class="mono">${esc(r.pedido)}</td>
      <td class="num">${r.linha??''}</td>
      <td class="num">${fmtD(r.data)}</td>
      <td class="num">${dias}</td>
      <td><span class="tag t-${s}">${LB[s]}</span></td>
      <td class="it">${esc(r.item)}<div class="cd">${esc(r.codigo)}</div></td>
      <td class="num">${r.qtd??''}</td>
      <td class="fn">${esc(r.fornecedor)}</td>
      <td>${esc(r.responsavel)||'<span style="color:#b8b4ac">—</span>'}</td>
      <td>${esc(r.comprador)}</td>
      <td class="obs">
        <div class="obs-cell ${r.obs?'':'empty'}"
             contenteditable="true" data-k="${esc(rk)}"
             >${r.obs?esc(r.obs):''}</div>
        ${!r.obs?'<div style="color:#b8b4ac;font-style:italic;font-size:11.5px;margin-top:2px;pointer-events:none">clique para escrever</div>':''}
        ${r.obsOrigem==='resgate'?'<div class="flag">anterior — confirmar</div>':''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="11" class="empty-state">
      Nenhuma linha com esses filtros.</td></tr>`;

  document.querySelectorAll('.obs-cell').forEach(el=>{
    el.addEventListener('focus',()=>{
      const sib = el.nextElementSibling;
      if(sib && sib.style.pointerEvents==='none') sib.style.display='none';
    });
    el.addEventListener('blur',()=>{
      const k = el.dataset.k;
      const txt = el.innerText.trim();
      const row = ROWS.find(r=>rowKey(r)===k);
      if(!row) return;
      if(txt === (row.obs||'')) return;
      tentarSalvar(el, row, txt);
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); el.blur(); }
      if(e.key==='Escape'){ e.preventDefault(); drawTable(); }
    });
  });

  if(d.length>600)
    document.getElementById('body').insertAdjacentHTML('beforeend',
      `<tr><td colspan="11" style="text-align:center;color:var(--ink-3);padding:12px">
        mostrando 600 de ${d.length} — refine os filtros ou exporte o CSV</td></tr>`);
}

function drawFoot(){
  const d = ofBase();
  const res = d.filter(r=>r.obsOrigem==='resgate').length;
  const ex  = d.filter(r=>r.obsOrigem==='exata').length;
  document.getElementById('foot').innerHTML =
    `Observações vinculadas pela chave exata: <b>${ex}</b> · recuperadas por resgate: <b>${res}</b>.
     Linhas marcadas <span class="flag">anterior — confirmar</span> tiveram a quantidade em aberto
     alterada no SAP, então a observação mostrada é a última conhecida daquele pedido/item/linha e
     precisa de conferência. Observações editadas aqui são gravadas na planilha assim que você sai
     do campo (Tab, clique fora ou Enter).`;
}

function resetFilters(){
  ['q','fResp','fComp','fForn','fProj','fObs','dMin','dMax','dtFrom','dtTo']
    .forEach(i=>document.getElementById(i).value='');
  RESP_SEL.clear();
}

function drawAll(){
  drawBases(); drawKpis();
  const isSC = base==='SC';
  fillSel('fResp','responsavel','Responsável');
  fillSel('fComp','comprador', isSC?'Solicitante':'Comprador');
  fillSel('fForn','fornecedor', isSC?'Origem':'Fornecedor');
  fillSel('fProj','projeto', isSC?'Projeto':'Projeto');
  document.getElementById('fObs').innerHTML =
    `<option value="">Observação (todas)</option>
     <option value="com">Com observação</option>
     <option value="sem">Sem observação</option>
     <option value="resgate">Resgatadas (confirmar)</option>`;
  drawResp(); drawRespPills(); drawTable(); drawFoot();
  const d = ofBase();

  mp2.forEach(rows=>{ if(pedStatus(rows)==='late') ltP++; });

}

['q','fResp','fComp','fForn','fProj','fObs','dMin','dMax','dtFrom','dtTo'].forEach(i=>{
  const el=document.getElementById(i);
  const ev = (i==='q'||i==='dMin'||i==='dMax') ? 'input' : 'change';
  el.addEventListener(ev,()=>{drawTable();});
});
document.getElementById('clr').onclick=()=>{resetFilters();kpi=null;drawKpis();drawRespPills();drawResp();drawTable();};

document.getElementById('csv').onclick=()=>{
  const d = filtered();
  const h = ['Base','Pedido','Linha','Data prevista','Dias','Status','Codigo','Item','Qtd',
             'Fornecedor','Responsavel','Comprador','Projeto','Observacao','Origem obs'];
  const rows = d.map(r=>[r.base,r.pedido,r.linha,fmtD(r.data),r.dias??'',LB[st(r)],r.codigo,
    r.item,r.qtd,r.fornecedor,r.responsavel,r.comprador,r.projeto,r.obs,r.obsOrigem]);
  const csv = '﻿'+[h,...rows].map(l=>l.map(c=>
    `"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `followup_${base}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

/* ---------- tema claro/escuro ---------- */
(function(){
  const TK='fup_theme';
  let t='light';
  try{ t=localStorage.getItem(TK)||'light'; }catch(e){}
  const apply=x=>{
    if(x==='dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    const b=document.getElementById('theme');
    if(b) b.textContent = x==='dark'?'☀':'☾';
  };
  apply(t);
  document.getElementById('theme').addEventListener('click',()=>{
    t = t==='dark'?'light':'dark';
    try{ localStorage.setItem(TK,t); }catch(e){}
    apply(t);
  });
})();

/* ---------- atualizar a partir da planilha viva ---------- */
async function atualizar(auto){
  if(auto && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('obs-cell')) return;
  const led = document.getElementById('led');
  led.style.color = 'var(--week)';
  try{
    ROWS = await lerTudo();
    kpi = null;
    if(!ROWS.some(r=>r.base===base)) base = (ROWS[0] && ROWS[0].base) || 'BR';
    ultimaAtualizacao = new Date();
    drawAll();
    led.style.color = 'var(--ok)';
  }catch(err){
    led.style.color = 'var(--late)';
    if(!auto) alert('Não consegui ler a planilha: '+(err&&err.message||err));
  }
}
document.getElementById('refresh').onclick = ()=>atualizar(false);

Office.onReady((info)=>{
  if(info.host !== Office.HostType.Excel){
    document.body.innerHTML = '<p style="padding:20px;font-family:sans-serif">Este painel só roda dentro do Excel.</p>';
    return;
  }
  atualizar(false);
  setInterval(()=>atualizar(true), 3*60*1000);
});
</script>
